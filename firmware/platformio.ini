; ATtiny3226 quote display firmware (megaTinyCore)
; https://docs.platformio.org/page/projectconf.html
; https://github.com/SpenceKonde/megaTinyCore/blob/master/megaavr/extras/PlatformIO.md

[platformio]
default_envs = quote
src_dir = src

[env]
platform = atmelmegaavr
framework = arduino
board = ATtiny3226
board_build.core = megaTinyCore
; Fastest in-spec clock at 3.3 V (datasheet: 10 MHz up to 4.5 V).
board_build.f_cpu = 10000000L
board_hardware.oscillator = internal
; Qualified BOD level for a 3.3 V rail (megaTinyCore fuse value).
board_hardware.bod = 2.6v
board_hardware.eesave = yes
board_hardware.updipin = updi
; Default atmelmegaavr toolchain is too old for 3226 device specs.
platform_packages =
	platformio/toolchain-atmelavr@~3.70300.0
build_flags =
	-DCLOCK_SOURCE=0
	-DMILLIS_USE_TIMERB1
	-Wall
	-Wextra
	-Isrc
	-Iinclude
	-DSDFAT_FILE_TYPE=1
	-DUSE_LONG_FILE_NAMES=1
	-DUSE_SD_CRC=0
build_unflags =
	-DMILLIS_USE_TIMERA0
monitor_speed = 9600

; Override upload_port for your SerialUPDI adapter, e.g.:
;   pio run -e quote -t upload --upload-port /dev/cu.usbserial-*
upload_protocol = serialupdi
upload_speed = 115200

lib_deps =
	greiman/SdFat@^2.2.3

[env:quote]
build_src_filter =
	+<*>
	-<host_*.cpp>

; Low-power current measurement builds (no UART / LED in production).
;   pio run -e quote_diag0
; States: 0 MCU PD, 1 MCU+PIT, 2 EPD rail idle, 3 refresh, 4 post-update PD
[env:quote_diag0]
extends = env:quote
build_flags =
	${env.build_flags}
	-DLOW_POWER_DIAGNOSTICS=1
	-DLOW_POWER_DIAG_STATE=0

[env:quote_diag1]
extends = env:quote
build_flags =
	${env.build_flags}
	-DLOW_POWER_DIAGNOSTICS=1
	-DLOW_POWER_DIAG_STATE=1

[env:quote_diag2]
extends = env:quote
build_flags =
	${env.build_flags}
	-DLOW_POWER_DIAGNOSTICS=1
	-DLOW_POWER_DIAG_STATE=2

[env:quote_diag3]
extends = env:quote
build_flags =
	${env.build_flags}
	-DLOW_POWER_DIAGNOSTICS=1
	-DLOW_POWER_DIAG_STATE=3

[env:quote_diag4]
extends = env:quote
build_flags =
	${env.build_flags}
	-DLOW_POWER_DIAGNOSTICS=1
	-DLOW_POWER_DIAG_STATE=4

; ---------------------------------------------------------------------------
; Host-side unit tests for pure logic (no hardware)
; Prefer: ./native/run_tests.sh
; ---------------------------------------------------------------------------
[env:native_test]
platform = native
build_src_filter = -<*>
test_framework = unity
test_filter = test_logic
build_flags =
	-DHOST_TEST=1
	-Iinclude
